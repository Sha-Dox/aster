name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core regression tests
        run: swift test
      - name: Package application
        run: |
          ./scripts/build-app.sh release
          mkdir -p artifacts
          ditto --norsrc --noextattr -c -k --keepParent ../Aster.app artifacts/Aster-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Aster-development
          path: artifacts/Aster-macOS.zip
          if-no-files-found: error
